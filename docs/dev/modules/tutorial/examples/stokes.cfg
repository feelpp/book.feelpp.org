# Configuration for Stokes solver
nu=1.0
penalbc=100

# Mesh parameters
gmsh.filename=$cfgdir/square.geo
gmsh.hsize=0.05

# Mixed solver parameters for Stokes
ksp-type=fgmres
pc-type=fieldsplit
pc-fieldsplit-type=schur
pc-fieldsplit-schur-factorization-type=diag

# Velocity block (component 0)
fieldsplit-0-ksp-type=preonly
fieldsplit-0-pc-type=ml

# Pressure block (component 1)  
fieldsplit-1-ksp-type=preonly
fieldsplit-1-pc-type=ml

# Solver tolerances
ksp-rtol=1e-8
ksp-max_it=1000

# Output parameters
exporter.format=ensight
exporter.directory=$repository/stokes
