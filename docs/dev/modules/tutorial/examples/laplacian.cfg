# Configuration for Laplacian solver
order=2
penalbc=100
weak-bc=false
mu=1.0

# Mesh parameters
gmsh.filename=$cfgdir/square.geo
gmsh.hsize=0.05

# Linear solver parameters
ksp-type=cg
pc-type=gamg
ksp-rtol=1e-8
ksp-max_it=1000

# Output parameters
exporter.format=ensight
exporter.directory=$repository/laplacian
